name: Triggering Events
on:
    push:
        branches:
            - "main"
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
        paths:
            - "srivatsa-demo/filters/*.md"
            - "!srivatsa-demo/filters/*.txt"
    workflow_dispatch:
jobs:
    demo-job:
        runs-on: ubuntu-latest
        steps:
            - name: Srivatsa-Demo
              run: |
                  echo "This is a demo workflow for Srivatsa"
                  echo " Triggered by push or pull request events"