name: passing varibles between jobs
on:
    workflow_dispatch
jobs:
    producer:
        runs-on: ubuntu-latest
        outputs: 
            foo: ${{steps.generate-foo.outputs.foo}}
        steps:
            - name: generate a variable 
              id: generate-foo
              run: |
                foo=bar

                echo "foo: ${foo}" >> $GITHUB_OUTPUT
                echo "FOO: ${foo}" >> $GITHUB_ENV
            - name: inspect the value in producer 
              run: |
                echo "FOO: ${FOO}"
                echo "foo: ${steps.generate-foo.outputs.foo}"
    consumer:
        runs-on: ubuntu-latest
        needs: producer
        steps: 
            - name: checking the value from producer 
              run: |
                echo "foo: ${needs.producer.outputs.foo}"
                echo "FOO: ${foo:-<UNSET>}"
